<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151e3d"/>
      <stop offset="1" stop-color="#090d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="440" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#86efac" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="470" cy="380" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#d9fbe6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#15803d" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- alternating halo rings: amber outer, green inner -->
    <circle cx="512" cy="440" r="420" fill="none" stroke="url(#amber)" stroke-width="44" opacity="0.55" filter="url(#blur)"/>
    <circle cx="512" cy="440" r="310" fill="none" stroke="#4ade80" stroke-width="36" opacity="0.5" filter="url(#blur)"/>

    <!-- ambient glow -->
    <circle cx="512" cy="440" r="470" fill="url(#glow)"/>

    <!-- bulb glass -->
    <path d="M512 214
             C 390 214, 300 306, 300 420
             C 300 492, 334 536, 372 582
             C 400 616, 412 646, 412 690
             L 612 690
             C 612 646, 624 616, 652 582
             C 690 536, 724 492, 724 420
             C 724 306, 634 214, 512 214 Z"
          fill="url(#glass)" filter="url(#soft)"/>
    <path d="M512 214
             C 390 214, 300 306, 300 420
             C 300 492, 334 536, 372 582
             C 400 616, 412 646, 412 690
             L 612 690
             C 612 646, 624 616, 652 582
             C 690 536, 724 492, 724 420
             C 724 306, 634 214, 512 214 Z"
          fill="none" stroke="#f8fafc" stroke-width="30" stroke-linejoin="round"/>

    <!-- specular highlight -->
    <ellipse cx="430" cy="340" rx="48" ry="78" fill="#ffffff" opacity="0.35" transform="rotate(-28 430 340)"/>

    <!-- filament: a terminal prompt -->
    <path d="M466 380 L 548 450 L 466 520" fill="none" stroke="#0a1a12" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- screw base -->
    <rect x="412" y="716" width="200" height="34" rx="17" fill="#f8fafc"/>
    <rect x="422" y="774" width="180" height="34" rx="17" fill="#f8fafc"/>
    <rect x="460" y="832" width="104" height="34" rx="17" fill="#f8fafc"/>
  </g>
</svg>
